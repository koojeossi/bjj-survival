<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화이트벨트 생존법</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--white:#fff;--black:#0f0f0e;
  --red:#c5392a;--red-dim:#fdf0ee;
  --blue:#1d4ed8;--blue-dim:#eff6ff;
  --amber:#d97706;--green:#15803d;
  --gray:#78766f;--gray-lt:#e9e7e2;
  --radius:14px;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--black);min-height:100vh;}

/* HEADER */
header{background:var(--black);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'Black Han Sans',sans-serif;font-size:18px;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:10px;}
.belt-strip{display:flex;gap:3px;}
.bs{width:14px;height:6px;border-radius:1px;}
.bs1{background:#e0e0e0;}.bs2{background:#3b6fd4;}.bs3{background:#7c3bd4;}.bs4{background:#8b4513;}.bs5{background:#fff;}
.back-btn{display:none;font-size:13px;font-weight:500;color:rgba(255,255,255,.7);background:none;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;cursor:pointer;transition:all .2s;}
.back-btn:hover{color:#fff;border-color:rgba(255,255,255,.5);}
.back-btn.visible{display:block;}

/* SCREENS */
.screen{display:none;animation:fadeUp .28s ease both;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── SCREEN 1 ── */
#screen1{padding:2rem 1.5rem 4rem;}
.intro-tag{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);margin-bottom:.75rem;}
.intro-title{font-family:'Black Han Sans',sans-serif;font-size:42px;line-height:1;color:var(--black);margin-bottom:.5rem;}
.intro-sub{font-size:14px;color:var(--gray);font-weight:300;margin-bottom:2.5rem;line-height:1.7;}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:1rem;display:flex;align-items:center;gap:.75rem;}
.section-label::after{content:'';flex:1;height:1px;background:var(--gray-lt);}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem;margin-bottom:2.5rem;}
.pos-card{background:var(--white);border:1.5px solid var(--gray-lt);border-radius:var(--radius);padding:1.1rem .9rem;cursor:pointer;transition:all .18s;text-align:center;}
.pos-card:hover{border-color:var(--black);transform:translateY(-2px);}
.pos-card.selected{border-color:var(--red);background:var(--red-dim);}
.pos-emoji{font-size:28px;margin-bottom:.5rem;}
.pos-name{font-size:13px;font-weight:700;color:var(--black);margin-bottom:3px;}
.pos-desc{font-size:11px;color:var(--gray);font-weight:300;line-height:1.4;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:2rem;}
.mode-card{background:var(--white);border:1.5px solid var(--gray-lt);border-radius:var(--radius);padding:1.1rem 1rem;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:.75rem;}
.mode-card:hover{border-color:var(--black);}
.mode-card.attack{border-left:3px solid #2a7ed4;}
.mode-card.defend{border-left:3px solid var(--red);}
.mode-card.selected.attack{border-color:var(--blue);background:var(--blue-dim);}
.mode-card.selected.defend{border-color:var(--red);background:var(--red-dim);}
.mode-icon{font-size:24px;flex-shrink:0;}
.mode-name{font-size:14px;font-weight:700;color:var(--black);margin-bottom:2px;}
.mode-desc{font-size:11.5px;color:var(--gray);font-weight:300;}
.go-btn{display:flex;align-items:center;justify-content:center;width:100%;font-size:15px;font-weight:700;background:var(--black);color:#fff;border:none;border-radius:var(--radius);padding:1rem;cursor:pointer;opacity:.3;pointer-events:none;transition:all .2s;}
.go-btn.ready{opacity:1;pointer-events:all;}
.go-btn.ready:hover{background:#333;}

/* ── SCREEN 1.5 (서브카테고리) ── */
#screen15{padding:1.5rem 1.5rem 4rem;}
.sub-breadcrumb{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.bc-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;}
.bc-badge.pos{background:var(--black);color:#fff;}
.bc-badge.mode-a{background:#ddeeff;color:#1a5fa8;}
.bc-badge.mode-d{background:var(--red-dim);color:var(--red);}
.bc-arrow{color:var(--gray-lt);font-size:14px;}
.sub-title{font-family:'Black Han Sans',sans-serif;font-size:34px;line-height:1;color:var(--black);margin-bottom:.4rem;}
.sub-subtitle{font-size:13px;color:var(--gray);font-weight:300;margin-bottom:2rem;}

/* 카테고리 카드 (서브미션/스윕) */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:2rem;}
.cat-card{background:var(--white);border:1.5px solid var(--gray-lt);border-radius:var(--radius);padding:1.2rem 1rem;cursor:pointer;transition:all .18s;text-align:center;}
.cat-card:hover{border-color:var(--black);transform:translateY(-2px);}
.cat-card.selected{border-color:var(--blue);background:var(--blue-dim);}
.cat-icon{font-size:30px;margin-bottom:.5rem;}
.cat-name{font-size:15px;font-weight:700;color:var(--black);margin-bottom:4px;}
.cat-desc{font-size:11px;color:var(--gray);font-weight:300;}

/* 기술 리스트 */
.tech-section{display:none;}
.tech-section.visible{display:block;}
.tech-grid{display:grid;grid-template-columns:1fr;gap:.6rem;margin-bottom:1.5rem;}
.tech-card{background:var(--white);border:1.5px solid var(--gray-lt);border-radius:var(--radius);padding:1rem 1.1rem;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:space-between;}
.tech-card:hover{border-color:var(--black);}
.tech-left{}
.tech-name{font-size:14px;font-weight:700;color:var(--black);margin-bottom:3px;}
.tech-name-en{font-size:11px;color:var(--gray);font-weight:300;font-style:italic;}
.tech-arrow{color:var(--gray-lt);font-size:18px;}

/* ── SCREEN 2 (솔루션) ── */
#screen2{padding:1.5rem 1.5rem 4rem;}
.sol-context{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.ctx-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;}
.ctx-badge.pos{background:var(--black);color:#fff;}
.ctx-badge.mode-a{background:#ddeeff;color:#1a5fa8;}
.ctx-badge.mode-d{background:var(--red-dim);color:var(--red);}
.ctx-badge.cat{background:#f3f4f6;color:#374151;}
.ctx-arrow{color:var(--gray-lt);font-size:14px;}
.sol-title{font-family:'Black Han Sans',sans-serif;font-size:38px;line-height:1;color:var(--black);margin-bottom:4px;}
.sol-title-en{font-size:13px;font-weight:300;color:var(--gray);font-style:italic;margin-bottom:1.5rem;}
.summary-card{background:var(--black);color:#fff;border-radius:var(--radius);padding:1.25rem 1.25rem 1.1rem;margin-bottom:1.25rem;}
.summary-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:.6rem;}
.summary-text{font-size:16px;font-weight:500;line-height:1.7;}
.summary-text strong{color:#fbbf24;}
.steps-wrap{margin-bottom:1.25rem;}
.steps-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:.85rem;display:flex;align-items:center;gap:.75rem;}
.steps-label::after{content:'';flex:1;height:1px;background:var(--gray-lt);}
.step-list{display:flex;flex-direction:column;gap:.5rem;}
.step-item{display:flex;align-items:flex-start;gap:.85rem;background:var(--white);border:1px solid var(--gray-lt);border-radius:10px;padding:.9rem 1rem;}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--black);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-title{font-size:13px;font-weight:700;color:var(--black);margin-bottom:3px;}
.step-desc{font-size:12px;color:var(--gray);font-weight:300;line-height:1.6;}
.warn-box{display:flex;align-items:flex-start;gap:.65rem;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:.85rem 1rem;margin-bottom:1.25rem;font-size:12.5px;line-height:1.6;color:#92400e;}
.warn-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.retry-btn{display:flex;align-items:center;justify-content:center;width:100%;font-size:14px;font-weight:700;background:none;color:var(--black);border:1.5px solid var(--black);border-radius:var(--radius);padding:.9rem;cursor:pointer;transition:all .15s;}
.retry-btn:hover{background:var(--black);color:#fff;}

@media(max-width:480px){.intro-title{font-size:32px;}.sol-title{font-size:30px;}.sub-title{font-size:28px;}.pos-grid{grid-template-columns:repeat(2,1fr);}.mode-grid{grid-template-columns:1fr;}.cat-grid{grid-template-columns:1fr;}}
@media(min-width:700px){#screen1,#screen15,#screen2{max-width:620px;margin:0 auto;}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="belt-strip">
      <div class="bs bs1"></div><div class="bs bs2"></div>
      <div class="bs bs3"></div><div class="bs bs4"></div><div class="bs bs5"></div>
    </div>
    화이트벨트 생존법
  </div>
  <button class="back-btn" id="backBtn" onclick="goBack()">← 뒤로</button>
</header>

<!-- SCREEN 1: 포지션 + 모드 -->
<div class="screen active" id="screen1">
  <div class="intro-tag">BJJ WHITE BELT GUIDE</div>
  <h1 class="intro-title">지금 어떤<br>상황이야?</h1>
  <p class="intro-sub">포지션과 상황을 선택하면<br>바로 해결법을 보여줄게.</p>
  <div class="section-label">포지션 선택</div>
  <div class="pos-grid">
    <div class="pos-card" data-pos="closedguard" onclick="selectPos(this)"><div class="pos-emoji">🔒</div><div class="pos-name">클로즈드 가드</div><div class="pos-desc">다리로 잠긴 상태</div></div>
    <div class="pos-card" data-pos="halfguard"   onclick="selectPos(this)"><div class="pos-emoji">🦵</div><div class="pos-name">하프 가드</div><div class="pos-desc">다리 하나만 잠긴</div></div>
    <div class="pos-card" data-pos="mount"       onclick="selectPos(this)"><div class="pos-emoji">⬆️</div><div class="pos-name">마운트</div><div class="pos-desc">배 위에 올라탄</div></div>
    <div class="pos-card" data-pos="sidecontrol" onclick="selectPos(this)"><div class="pos-emoji">↔️</div><div class="pos-name">사이드 컨트롤</div><div class="pos-desc">옆에서 눌리는</div></div>
    <div class="pos-card" data-pos="back"        onclick="selectPos(this)"><div class="pos-emoji">🎯</div><div class="pos-name">백</div><div class="pos-desc">등을 내준 상태</div></div>
  </div>
  <div class="section-label">내 역할 선택</div>
  <div class="mode-grid">
    <div class="mode-card attack" data-mode="attack" onclick="selectMode(this)">
      <div class="mode-icon">⚔️</div>
      <div><div class="mode-name">내가 잡은 포지션</div><div class="mode-desc">내가 그 포지션을 걸고 있음</div></div>
    </div>
    <div class="mode-card defend" data-mode="defend" onclick="selectMode(this)">
      <div class="mode-icon">🛡️</div>
      <div><div class="mode-name">상대가 잡은 포지션</div><div class="mode-desc">상대가 그 포지션을 걸고 있음</div></div>
    </div>
  </div>
  <button class="go-btn" id="goBtn" onclick="next()">다음 →</button>
</div>

<!-- SCREEN 1.5: 서브카테고리 선택 -->
<div class="screen" id="screen15">
  <div class="sub-breadcrumb" id="subBreadcrumb"></div>
  <div class="sub-title" id="subTitle"></div>
  <div class="sub-subtitle" id="subSubtitle"></div>

  <!-- 카테고리 선택 -->
  <div class="section-label">목표 선택</div>
  <div class="cat-grid" id="catGrid"></div>

  <!-- 기술 목록 (카테고리 선택 후 표시) -->
  <div class="tech-section" id="techSection">
    <div class="section-label" id="techLabel"></div>
    <div class="tech-grid" id="techGrid"></div>
  </div>
</div>

<!-- SCREEN 2: 솔루션 -->
<div class="screen" id="screen2">
  <div class="sol-context" id="solContext"></div>
  <div class="sol-title" id="solTitle"></div>
  <div class="sol-title-en" id="solTitleEn"></div>
  <div class="summary-card"><div class="summary-label">한 줄 요약</div><div class="summary-text" id="solSummary"></div></div>
  <div class="steps-wrap">
    <div class="steps-label">단계별 방법</div>
    <div class="step-list" id="solSteps"></div>
  </div>
  <div class="warn-box" id="solWarn" style="display:none"><div class="warn-icon">⚠️</div><div id="solWarnText"></div></div>
  <button class="retry-btn" onclick="goHome()">↺ 처음부터</button>
</div>

<script>
// ─── DEBUG ───────────────────────────────────
const DEBUG = true;
const log = (...a) => DEBUG && console.log('%c[생존법]','color:#c5392a;font-weight:bold',...a);
const err = (...a) => console.error('%c[생존법 ERR]','color:red;font-weight:bold',...a);

// ─── STATE ───────────────────────────────────
let selPos = null, selMode = null, selCat = null;
let history = []; // 화면 히스토리 스택

// ─── SUBCATEGORY DB ──────────────────────────
const SUBCATS = {
  closedguard_attack: {
    title: '뭘 노릴거야?',
    subtitle: '클로즈드 가드에서 목표를 골라.',
    categories: [
      {
        id: 'submission',
        icon: '🔺',
        name: '서브미션',
        desc: '탭 받기',
        techniques: ['armbar','triangle','kimura']
      },
      {
        id: 'sweep',
        icon: '🔄',
        name: '스윕',
        desc: '탑 포지션 뺏기',
        techniques: ['hipbump','scissors','pendulum']
      }
    ]
  }
};

// ─── TECHNIQUE DB ────────────────────────────
const TECHNIQUES = {
  // ── 클로즈드 가드 서브미션 ──
  armbar: {
    name: '암바', nameEn: 'Armbar from Closed Guard',
    cat: '서브미션',
    summary: '상대 팔 하나를 <strong>팔꿈치가 접히는 반대 방향으로 꺾어</strong>. 팔꿈치가 내 배꼽 방향을 향해야 해.',
    steps: [
      { title: '한쪽 팔 잡기', desc: '상대 한쪽 삼두근 깃을 잡아. (대각선 손으로 잡아야해. 상대의 왼쪽 삼두를 잡으려면 내 오른손으로.)' },
      { title: '밀착', desc: '반대 손으로 상대 어깨깃을 잡고 내 몸쪽으로 당겨. (상대 팔꿈치가 내 배꼽위에 붙어있어야 해)' },
      { title: '각도 틀기1', desc: '클로즈 가드를 풀고 상대 팔 잡은쪽의 골반을 같은쪽 발로 밟아.'},
      { title: '각도 틀기2', desc: '암바를 걸 팔과 내 정수리가 일직선이 되도록 몸을 회전시켜. (놀고있는 다리의 종아리로 상대 등을 눌러주면 좋아)' },
      { title: '다리로 잠그기', desc: '몸이 상대와 직각이 되었다면, 골반을 밟고있던 다리를 풀어서 상대 머리 너머로 넘겨.' },
      { title: '꺾기', desc: '엉덩이를 들어올리며 팔꿈치를 관절 반대 방향으로 꺾어. 천천히 — 탭 소리 나면 즉시 멈춰. (상대의 새끼손가락이 내 명치에 붙어있어야 잘 걸려)' },
    ],
    warn: '팔꿈치가 배꼽 방향 아닌 옆을 향하면 효과 없어. 각도가 전부야.',
  },
  triangle: {
    name: '트라이앵글 초크', nameEn: 'Triangle Choke',
    cat: '서브미션',
    summary: '다리로 상대 <strong>목과 한쪽 팔을 함께 잠가</strong> 경동맥을 압박.',
    steps: [
      { title: '양 손목 잡기', desc: '상대의 양 손목을 양손으로 잡아.(같은쪽 같은손)' },
      { title: '팔 하나 안으로', desc: '상대 팔 하나를 안쪽(내 몸 쪽)으로 당기고, 다른 쪽 팔은 상대 배쪽으로 밀어놔.' },
      { title: '클로즈 가드 풀기', desc: '클로즈 가드를 풀고, 당긴 쪽 팔의 골반을 같은쪽 발로 밟아' },
      { title: '상대 머리 낚아채기', desc: '상대 골반을 디딘채로 반대 다리를 상대 머리 위로 올려. (이때 배쪽으로 밀어놓은 손을 놓아야 다리가 올라가)' },
      { title: '상대 머리 낚아채기2', desc: '머리 위로 올린 다리의 오금을 상대의 뒤통수에 걸어.' },
      { title: '트라이앵글 그립 완성하기', desc: '골반을 딛고있던 다리를 발목에 걸어.' },
      { title: '피니시', desc: '허벅지를 모으고 엉덩이를 들어올려. 목 양쪽 혈관이 막히면 탭이 나와.' },
    ],
    warn: '두 팔이 다 안에 있으면 초크가 안 걸려. 반드시 팔 하나만 안에.',
  },
  kimura: {
    name: '기무라락', nameEn: 'Kimura Lock',
    cat: '서브미션',
    summary: '상대 팔을 등 뒤로 꺾는 <strong>숄더 조인트 락</strong>. 그립이 핵심이야.',
    steps: [
      { title: '손목 잡기', desc: '상대 한쪽 손목을 같은 쪽 손으로 잡아 바닥에 고정시켜.' },
      { title: '기무라 그립', desc: '반대 손을 상대 팔꿈치 위로 넘겨 내 손목을 잡아 — 이게 기무라 그립이야.' },
      { title: '팔 들어올리기', desc: '가드를 열고 옆으로 돌아누우면서 상대 팔꿈치를 위로 들어.' },
      { title: '등 뒤로 꺾기', desc: '손목을 등 뒤쪽 방향으로 밀어 어깨 관절을 압박해. 천천히 올려.' },
    ],
    warn: null,
  },

  // ── 클로즈드 가드 스윕 ──
  hipbump: {
    name: '힙 범프 스윕', nameEn: 'Hip Bump Sweep',
    cat: '스윕',

// ─── HELPERS ─────────────────────────────────
const POS_LABEL = {closedguard:'클로즈드 가드',halfguard:'하프 가드',mount:'마운트',sidecontrol:'사이드 컨트롤',back:'백'};

function makeBadge(text, cls) {
  return `<span class="ctx-badge ${cls}">${text}</span>`;
}
function makeArrow() {
  return `<span class="ctx-arrow">›</span>`;
}

// ─── SCREEN TRANSITIONS ──────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  log('화면:', id);
}

function goBack() {
  if (history.length === 0) return;
  const prev = history.pop();
  log('뒤로:', prev);

  if (prev === 'screen1') {
    document.getElementById('backBtn').classList.remove('visible');
    showScreen('screen1');
  } else if (prev === 'screen15') {
    // 서브카테고리 화면으로 돌아갈 때 카테고리 선택 초기화
    selCat = null;
    document.getElementById('techSection').classList.remove('visible');
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
    showScreen('screen15');
  }
}

function goHome() {
  selPos = null; selMode = null; selCat = null;
  history = [];
  document.querySelectorAll('.pos-card,.mode-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('goBtn').classList.remove('ready');
  document.getElementById('backBtn').classList.remove('visible');
  showScreen('screen1');
}

// ─── SCREEN 1 ────────────────────────────────
function selectPos(el) {
  document.querySelectorAll('.pos-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selPos = el.dataset.pos;
  log('포지션:', selPos);
  checkReady();
}
function selectMode(el) {
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selMode = el.dataset.mode;
  log('모드:', selMode);
  checkReady();
}
function checkReady() {
  const btn = document.getElementById('goBtn');
  (selPos && selMode) ? btn.classList.add('ready') : btn.classList.remove('ready');
}
function next() {
  if (!selPos || !selMode) return;
  const key = `${selPos}_${selMode}`;
  log('키:', key);

  if (SUBCATS[key]) {
    // 서브카테고리 화면으로
    history.push('screen1');
    document.getElementById('backBtn').classList.add('visible');
    buildSubcatScreen(key);
    showScreen('screen15');
  } else if (TECHNIQUES[key]) {
    // 바로 솔루션
    history.push('screen1');
    document.getElementById('backBtn').classList.add('visible');
    buildSolutionScreen(key);
    showScreen('screen2');
  } else {
    err('키 없음:', key);
  }
}

// ─── SCREEN 1.5 ──────────────────────────────
function buildSubcatScreen(key) {
  const sub = SUBCATS[key];
  const modeLabel = selMode === 'attack' ? '내가 잡은 포지션' : '상대가 잡은 포지션';
  const modeCls   = selMode === 'attack' ? 'mode-a' : 'mode-d';

  document.getElementById('subBreadcrumb').innerHTML =
    makeBadge(POS_LABEL[selPos], 'pos') + makeArrow() + makeBadge(modeLabel, modeCls);
  document.getElementById('subTitle').textContent = sub.title;
  document.getElementById('subSubtitle').textContent = sub.subtitle;

  // 카테고리 카드 렌더
  document.getElementById('catGrid').innerHTML = sub.categories.map(cat =>
    `<div class="cat-card" data-catid="${cat.id}" onclick="selectCat(this,'${key}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-desc">${cat.desc}</div>
    </div>`
  ).join('');

  // 기술 섹션 초기화
  selCat = null;
  document.getElementById('techSection').classList.remove('visible');
  log('서브카테고리 화면 빌드:', key);
}

function selectCat(el, key) {
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selCat = el.dataset.catid;
  log('카테고리:', selCat);

  const sub = SUBCATS[key];
  const cat = sub.categories.find(c => c.id === selCat);
  if (!cat) { err('카테고리 없음:', selCat); return; }

  // 기술 목록 렌더
  document.getElementById('techLabel').textContent = cat.name + ' 기술 선택';
  document.getElementById('techGrid').innerHTML = cat.techniques.map(tid => {
    const tech = TECHNIQUES[tid];
    if (!tech) { err('기술 없음:', tid); return ''; }
    return `<div class="tech-card" onclick="selectTech('${tid}','${key}')">
      <div class="tech-left">
        <div class="tech-name">${tech.name}</div>
        <div class="tech-name-en">${tech.nameEn}</div>
      </div>
      <div class="tech-arrow">›</div>
    </div>`;
  }).join('');

  document.getElementById('techSection').classList.add('visible');
  log('기술 목록 렌더:', cat.techniques);
}

function selectTech(tid, parentKey) {
  log('기술 선택:', tid);
  history.push('screen15');
  buildSolutionScreen(tid, parentKey);
  showScreen('screen2');
}

// ─── SCREEN 2 ────────────────────────────────
function buildSolutionScreen(key, parentKey) {
  const sol = TECHNIQUES[key];
  if (!sol) { err('솔루션 없음:', key); return; }

  const modeLabel = selMode === 'attack' ? '내가 잡은 포지션' : '상대가 잡은 포지션';
  const modeCls   = selMode === 'attack' ? 'mode-a' : 'mode-d';

  let contextHTML = makeBadge(POS_LABEL[selPos], 'pos') + makeArrow() + makeBadge(modeLabel, modeCls);
  if (sol.cat) contextHTML += makeArrow() + makeBadge(sol.cat, 'cat');

  document.getElementById('solContext').innerHTML = contextHTML;
  document.getElementById('solTitle').textContent   = sol.name;
  document.getElementById('solTitleEn').textContent = sol.nameEn;
  document.getElementById('solSummary').innerHTML   = sol.summary;
  document.getElementById('solSteps').innerHTML = (sol.steps||[]).map((s,i) =>
    `<div class="step-item">
      <div class="step-num">${i+1}</div>
      <div><div class="step-title">${s.title}</div><div class="step-desc">${s.desc}</div></div>
    </div>`
  ).join('');

  const warnBox = document.getElementById('solWarn');
  if (sol.warn) {
    document.getElementById('solWarnText').textContent = sol.warn;
    warnBox.style.display = 'flex';
  } else {
    warnBox.style.display = 'none';
  }
  log('솔루션 렌더 완료:', key);
}

  sub.categories.forEach(cat => {
    cat.techniques.forEach(tid => {
      if (!TECHNIQUES[tid]) err(`기술 누락: ${key} > ${cat.id} > ${tid}`);
    });
  });
});
